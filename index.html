    function RenaissanceArmillary() {
      const mountRef = useRef(null);

      useEffect(() => {
        if (!mountRef.current) return;
        const container = mountRef.current;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 4.2;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x121212, wireframe: true });
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xA37C40, wireframe: true });

        const r1 = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.015, 16, 80), ringMat1);
        const r2 = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.015, 16, 80), ringMat2);
        const r3 = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.015, 16, 80), ringMat1);
        r2.rotation.x = Math.PI / 3;
        r3.rotation.y = Math.PI / 3;

        group.add(r1);
        group.add(r2);
        group.add(r3);

        const core = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.55, 1),
          new THREE.MeshBasicMaterial({ color: 0x121212, wireframe: true, transparent: true, opacity: 0.75 })
        );
        group.add(core);

        let animationFrameId;
        const animate = () => {
          group.rotation.y += 0.008;
          group.rotation.x += 0.004;
          core.rotation.y -= 0.012;
          renderer.render(scene, camera);
          animationFrameId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          if (container && renderer.domElement) container.removeChild(renderer.domElement);
        };
      }, []);

      return <div ref={mountRef} className="w-52 h-52 sm:w-60 sm:h-60 mx-auto relative z-10" />;
    }

    function ThreeBackground() {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        const container = containerRef.current;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 4.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const geometry = new THREE.TorusKnotGeometry(1.2, 0.35, 120, 24);
        const particlesCount = 1400;
        const positions = new Float32Array(particlesCount * 3);
        const posArray = geometry.attributes.position.array;

        for (let i = 0; i < particlesCount * 3; i++) {
          positions[i] = posArray[i % posArray.length] + (Math.random() - 0.5) * 0.12;
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.018,
          color: 0x6320EE,
          transparent: true,
          opacity: 0.35,
        });

        const particleMesh = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleMesh);

        let mouseX = 0;
        let mouseY = 0;
        const handleMouseMove = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 0.8;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 0.8;
        };
        window.addEventListener('mousemove', handleMouseMove);

        let animationFrameId;
        const animate = () => {
          particleMesh.rotation.y += 0.002;
          particleMesh.rotation.x += 0.001;
          particleMesh.rotation.y += (mouseX - particleMesh.rotation.y) * 0.05;
          particleMesh.rotation.x += (mouseY - particleMesh.rotation.x) * 0.05;
          renderer.render(scene, camera);
          animationFrameId = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('mousemove', handleMouseMove);
          if (container && renderer.domElement) container.removeChild(renderer.domElement);
        };
      }, []);

      return <div ref={containerRef} className="absolute inset-0 pointer-events-none z-0" />;
    }

    function use3DTilt() {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -3;
        const rotateY = ((x - centerX) / centerX) * 3;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.008, 1.008, 1.008)`;
      };

      const handleMouseLeave = () => {
        const card = cardRef.current;
        if (!card) return;
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      };

      return { cardRef, handleMouseMove, handleMouseLeave };
    }
